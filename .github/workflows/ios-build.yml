name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env
        run: |
          echo "VITE_SUPABASE_URL=https://izhynmcctypoiifnqvfu.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6aHlubWNjdHlwb2lpZm5xdmZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTQxOTYsImV4cCI6MjEwNTc5MDE5Nn0._LFkHhJI_6harj7_bjnbLm67hdst6B3bET55ypk26VA" >> .env

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App
        working-directory: ./ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package .ipa
        working-directory: ./ios/App
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app build/Payload/
          cd build && zip -r PanritaEdu.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanritaEdu-iOS-App
          path: ios/App/build/PanritaEdu.ipa
